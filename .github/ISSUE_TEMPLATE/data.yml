name: 企业资料与作息反馈
description: 提交公开、可核对的资料，列明办公室或工厂以及适用岗位。
title: "[资料线索] "
body:
  - type: markdown
    attributes:
      value: "Issue 提交后公开。不要上传工牌、考勤原件、个人联系方式或内部文件。提交内容须经审核，不会自动进入名单。"
  - type: dropdown
    id: type
    attributes:
      label: 地点类型
      options: [办公室, 工厂, 门店, 仓储, 其他]
    validations:
      required: true
  - type: input
    id: entity
    attributes:
      label: 品牌、经营主体和具体地点
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: 城市、岗位、用工类型和观察期间
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: 作息事实与公开来源链接
      description: 说明是固定周末双休、每周休两日、大小周、单休还是轮班，不作违法定性。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布前确认
      options:
        - label: 已了解内容公开，仅提交必要事实与公开来源，不包含个人敏感信息。
          required: true
