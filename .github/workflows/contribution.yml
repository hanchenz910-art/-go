name: Demo contribution candidate
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, '不得进入正式名单')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Generate unsigned candidate from fictional issue
        env:
          SOURCE_REPO: ${{ github.repository }}
        run: node scripts/contribution.mjs --repo "$SOURCE_REPO" --event "$GITHUB_EVENT_PATH" --input tests/fixtures/demo-v2.sxlist.json --out candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-demo-candidate
          path: candidate.json
